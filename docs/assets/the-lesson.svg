<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360" role="img" aria-labelledby="title"><title id="title">YOU BUILT IT. NOW EXPLAIN IT.</title><rect width="880" height="360" fill="white"/><g stroke="#e4e4e4" stroke-width="1"><path d="M0 78H880"/><path d="M0 108H880"/><path d="M0 138H880"/><path d="M0 168H880"/><path d="M0 198H880"/><path d="M0 228H880"/><path d="M0 258H880"/><path d="M0 288H880"/><path d="M0 318H880"/><path d="M0 348H880"/></g><path d="M38 0L40 360" stroke="#aaa" fill="none"/><g fill="#111" font-family="monospace"><text x="64" y="48" font-size="25" font-weight="bold">YOU BUILT IT. NOW EXPLAIN IT.</text><text x="65" y="103" font-size="22" font-weight="normal">01  Read the actual code.</text><text x="65" y="143" font-size="22" font-weight="normal">02  Connect each answer to its source.</text><text x="65" y="183" font-size="22" font-weight="normal">03  Practise saying it out loud.</text><path d="M78 222Q300 217 532 225M525 218L538 225L525 232" stroke="#111" stroke-width="2" fill="none"/><text x="65" y="279" font-size="19" font-weight="bold">YOUR REPOSITORY</text><text x="555" y="279" font-size="19" font-weight="bold">YOUR STUDY NOTEBOOK</text><text x="65" y="326" font-size="17" font-weight="normal">Codex / Claude does the reasoning. Mercy brings the evidence.</text></g><path d="M8 7L872 5L875 353L6 351Z" fill="none" stroke="#111" stroke-width="2"/></svg>