<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360" role="img" aria-labelledby="title"><title id="title">THE FOLDER SAYS RAG. THE CODE GETS A VOTE.</title><rect width="880" height="360" fill="white"/><g stroke="#e4e4e4" stroke-width="1"><path d="M0 78H880"/><path d="M0 108H880"/><path d="M0 138H880"/><path d="M0 168H880"/><path d="M0 198H880"/><path d="M0 228H880"/><path d="M0 258H880"/><path d="M0 288H880"/><path d="M0 318H880"/><path d="M0 348H880"/></g><path d="M38 0L40 360" stroke="#aaa" fill="none"/><g fill="#111" font-family="monospace"><text x="64" y="48" font-size="25" font-weight="bold">THE FOLDER SAYS RAG. THE CODE GETS A VOTE.</text><text x="65" y="102" font-size="17" font-weight="bold">THE FIRST ANSWER</text><text x="65" y="143" font-size="23" font-weight="normal">&quot;It uses RAG.&quot;</text><text x="65" y="183" font-size="16" font-weight="normal">Because the folder is mini-rag.</text><path d="M430 80L428 302" stroke="#111" stroke-width="2" fill="none"/><text x="460" y="102" font-size="17" font-weight="bold">AFTER READING THE SOURCE</text><text x="460" y="143" font-size="20" font-weight="normal">An API prompt is visible.</text><text x="460" y="183" font-size="18" font-weight="normal">Retrieval is not implemented.</text><text x="460" y="223" font-size="17" font-weight="bold">rag.py:5-11</text><text x="65" y="326" font-size="17" font-weight="normal">A name is a clue. A source citation is something you can inspect.</text></g><path d="M8 7L872 5L875 353L6 351Z" fill="none" stroke="#111" stroke-width="2"/></svg>