name: Build and publish release
on:
  push:
    branches: [main]
    paths: [pyproject.toml, .github/workflows/release.yml, "docs/releases/**"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mercy-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install build and test dependencies
        run: python -m pip install build pytest reportlab
      - name: Check toolkit and notebook
        run: |
          python -m pytest -q
          node --test tests/*.test.cjs
      - name: Build release artifacts
        run: |
          python -m build
          cp output-example/mercy-studio.html dist/mercy-studio.html
          cd dist
          sha256sum *.whl *.tar.gz *.html > SHA256SUMS.txt
      - name: Verify installed wheel
        run: |
          python -m venv /tmp/mercy-release-check
          /tmp/mercy-release-check/bin/pip install dist/*.whl
          cd /tmp
          /tmp/mercy-release-check/bin/python -c 'import mercy; from importlib.resources import files; from importlib.metadata import version; assert mercy.__version__ == version("mercy-viva"); assert files("mercy").joinpath("assets/teacher.webp").is_file(); assert files("mercy").joinpath("integrations/codex/SKILL.md").is_file()'
          /tmp/mercy-release-check/bin/mercy --help
          mkdir /tmp/mercy-release-example
          printf 'def hello(): return "hi"\n' > /tmp/mercy-release-example/app.py
          /tmp/mercy-release-check/bin/mercy prepare --guided --project /tmp/mercy-release-example
          test -s /tmp/mercy-release-example/mercy-output/mercy-studio.html
      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG=$(python -c 'import tomllib; v=tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]; print("v" + (v[:-2] if v.endswith(".0") else v))')
          gh release create "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Mercy $RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md" --latest
